<div class="min-h-screen bg-dark-900 text-dark-100 pt-24 pb-16">
  <div class="max-w-4xl mx-auto px-4">
    <!-- Header -->
    <div class="text-center mb-16">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">Get in Touch</h1>
      <p class="text-xl text-dark-300 max-w-2xl mx-auto">
        Ready to transform your safety management? Let's discuss how CrewSafe can help your team.
      </p>
      <p class="text-dark-400 mt-4">
        Prefer email? <a href="mailto:hello&#64;crewsafe.app" class="text-primary-400 hover:text-primary-300 underline">hello&#64;crewsafe.app</a>
      </p>
    </div>

    <!-- Contact Form -->
    <div class="card max-w-2xl mx-auto">
      <form class="space-y-6" (submit)="$event.preventDefault()">
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-white mb-2">
              Name <span class="text-red-400">*</span>
            </label>
            <input 
              type="text" 
              placeholder="Jane Doe" 
              required 
              class="w-full px-4 py-3 bg-dark-700 border border-dark-600 rounded-lg text-white placeholder-dark-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-white mb-2">
              Company
            </label>
            <input 
              type="text" 
              placeholder="Acme Construction" 
              class="w-full px-4 py-3 bg-dark-700 border border-dark-600 rounded-lg text-white placeholder-dark-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            />
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-white mb-2">
            Email <span class="text-red-400">*</span>
          </label>
          <input 
            type="email" 
            placeholder="you@company.com" 
            required 
            class="w-full px-4 py-3 bg-dark-700 border border-dark-600 rounded-lg text-white placeholder-dark-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-white mb-2">
            Message
          </label>
          <textarea 
            rows="5" 
            placeholder="Tell us about your safety workflow and how we can help..."
            class="w-full px-4 py-3 bg-dark-700 border border-dark-600 rounded-lg text-white placeholder-dark-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-none"
          ></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary w-full">
          Send Message
        </button>
      </form>
    </div>

    <!-- Additional Contact Info -->
    <div class="mt-16 text-center">
      <h2 class="text-2xl font-bold text-white mb-8">Other Ways to Connect</h2>
      <div class="grid md:grid-cols-3 gap-8 max-w-3xl mx-auto">
        <div class="text-center">
          <div class="w-16 h-16 bg-primary-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
          </div>
          <h3 class="text-lg font-semibold text-white mb-2">Email</h3>
          <p class="text-dark-300">hello&#64;crewsafe.app</p>
        </div>
        
        <div class="text-center">
          <div class="w-16 h-16 bg-primary-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
            </svg>
          </div>
          <h3 class="text-lg font-semibold text-white mb-2">Phone</h3>
          <p class="text-dark-300">+1 (555) 123-4567</p>
        </div>
        
        <div class="text-center">
          <div class="w-16 h-16 bg-primary-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </div>
          <h3 class="text-lg font-semibold text-white mb-2">Office</h3>
          <p class="text-dark-300">San Francisco, CA</p>
        </div>
      </div>
    </div>
  </div>
</div>
